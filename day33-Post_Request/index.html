<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form id="ProdForm" action="">
        <h1>User-Form</h1>
        <input type="url" placeholder="Enter image link" name="Pimg" id="img">
        <input type="text" placeholder="Enter the name" name="Pname" id="name">
        <select name="Pcategory" id="category">
            <option value="None">None</option>
            <option value="Mens">Mens</option>
            <option value="Womens">Womens</option>
            <option value="Kids">Kids</option>
            <option value="Electronics">Electronics</option>
        </select>
        <input type="number" placeholder="Enter the price" name="Pprice" id="price">
        <input type="text" placeholder="Enter the description" name="Pdescription" id="description">
        <input type="submit" name="" id="">
    </form>
</body>
<script src="./script.js"></script>
</html>
