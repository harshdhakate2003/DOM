<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div id="calculator">

        <div id="screen">
            <h3 id="prev"></h3>
            <h2 id="curr"></h2>
            <h2 id="operation"></h2>
        </div>

        <div id="keypad">
            <button class="keys" onclick="handelClick(1)">1</button>
            <button class="keys" onclick="handelClick(2)">2</button>
            <button class="keys" onclick="handelClick(3)">3</button>
            <button class="keys" onclick="handelClick(4)">4</button>
            <button class="keys" onclick="handelClick(5)">5</button>
            <button class="keys" onclick="handelClick(6)">6</button>
            <button class="keys" onclick="handelClick(7)">7</button>
            <button class="keys" onclick="handelClick(8)">8</button>
            <button class="keys" onclick="handelClick(9)">9</button>
            <button class="keys" onclick="handelClick(0)">0</button>
            <button class="keys" onclick="handelClick('+')">+</button>
            <button class="keys" onclick="handelClick('-')">-</button>
            <button class="keys" onclick="handelClick('*')">*</button>
            <button class="keys" onclick="handelClick('/')">/</button>
            <button class="keys" onclick="handelClick('=')">=</button>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
